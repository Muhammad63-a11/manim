name: Generate Math & Physics Animations 1

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Type or Paste your Formula (LaTeX notation supported)'
        required: true
        default: 'F = ma'
        type: string
      animation_style:
        description: 'Choose the visual layout for this video'
        required: true
        default: 'text_only'
        type: choice
        options:
          - 'text_only'
          - 'physics_simulation'

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install System Dependencies (LaTeX & Graphics)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          
          # 1. Install base dependencies with no-recommends to keep runner lightweight
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xvfb \
            pkg-config \
            libpango1.0-dev \
            texlive \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            dvisvgm

          # 2. Install fonts WITH recommendations so tipa.sty and its fonts map correctly
          sudo apt-get install -y texlive-fonts-extra

          # physics.sty is supplied by texlive-science. Fail here with a
          # useful message instead of waiting for the animation render to fail.
          PHYSICS_STY="$(kpsewhich physics.sty || true)"
          if [[ -z "$PHYSICS_STY" || ! -f "$PHYSICS_STY" ]]; then
            echo 'physics.sty was not installed by texlive-science' >&2
            apt-cache show texlive-science >&2 || true
            exit 1
          fi
          echo "Using $PHYSICS_STY"

      - name: Install Python Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -e .

      - name: Generate Dynamic Media Video
        env:
          USER_FORMULA: ${{ github.event.inputs.formula }}
          USER_STYLE: ${{ github.event.inputs.animation_style }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$USER_FORMULA" > formula_input.txt
          printf '%s\n' "$USER_STYLE" > style_input.txt
          mkdir -p videos
          xvfb-run -a manimgl example_scenes.py DynamicTexScene -w

      - name: Upload Generated Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: physics-animations
          path: videos/
          if-no-files-found: error
