name: Generate Math Animations

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Type or Paste your LaTeX Formula (e.g., e^{i\\pi} + 1 = 0)'
        required: true
        default: 'f(x) = \\int_a^b g(x) dx'
        type: string

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (LaTeX & Graphics)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev
          sudo apt-get install -y pkg-config libpango1.0-dev
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-extra dvisvgm

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Generate Dynamic Formula Video
        env:
          USER_FORMULA: ${{ github.event.inputs.formula }}
        run: |
          # 1. Take the formula from the input window and write it to a temporary data file
          echo "$USER_FORMULA" > formula_input.txt
          
          # 2. Run the dynamic layout engine scene
          manimgl example_scenes.py DynamicTexScene -w

      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: math-animations
          path: videos/
