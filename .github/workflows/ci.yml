name: Generate Math Animations

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (LaTeX & Graphics)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev
          sudo apt-get install -y pkg-config libpango1.0-dev
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-extra dvisvgm

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Generate Manim Video
        run: |
          manim example_scenes.py TexTransform -l

      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: math-animations
          path: videos/
