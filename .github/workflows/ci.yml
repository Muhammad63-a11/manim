name: CI Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code under $GITHUB_WORKSPACE
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up the desired Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to your project's Python version
          cache: 'pip'          # Caches pip dependencies to speed up future runs

      # Step 3: Install system-level dependencies (Crucial for packages like Manim)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev

      # Step 4: Install Python packages and dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # If your repository uses setup.py/setup.cfg, install the package locally:
          pip install -e .

      # Step 5: Run your test suite
      - name: Run Tests
        run: |
          # Replace 'pytest' with whatever test framework or script you use
          # e.g., python -m unittest discover tests/
          if python -m pytest --version > /dev/null 2>&1; then
            pytest
          else
            echo "pytest not found, running basic validation script..."
            python setup.py check
          fi
